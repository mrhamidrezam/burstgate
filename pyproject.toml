[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "burstgate"
version = "0.1.0"
description = "Resilient, zero-dependency rate limiting, dual-resource token budgeting (RPM/TPM), and adaptive concurrency control for Python."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "Hamidreza", email = "h4midrezam@gmail.com"}
]
keywords = [
    "rate-limiting",
    "rate-limiter",
    "token-bucket",
    "sliding-window",
    "leaky-bucket",
    "llm",
    "tokens-per-minute",
    "rpm",
    "tpm",
    "adaptive-concurrency",
    "traffic-shaping",
    "asyncio",
    "sqlite-wal",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Networking",
    "Topic :: Internet",
    "Typing :: Typed",
]

[project.scripts]
burstgate = "burstgate.cli:main"

[project.urls]
Homepage = "https://github.com/mrhamidrezam/burstgate"
Repository = "https://github.com/mrhamidrezam/burstgate"
Issues = "https://github.com/mrhamidrezam/burstgate/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
